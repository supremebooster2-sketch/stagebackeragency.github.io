<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Independent Boss</title>
    <style>
      :root {
        --page-bg: #f4f1ee;
        --header-bg: #f6f3f1;
        --ink: #4b2d22;
        --ink-soft: #5e4339;
        --nav: #4d4e60;
        --gold: #8a5a3d;
        --gold-deep: #6c3a2a;
        --gold-soft: #b88966;
        --hero-bg: #a89a8c;
        --hero-shadow: rgba(67, 53, 46, 0.32);
        --vase: #f9f6f3;
        --vase-shadow: #d9d2ce;
        --candle: #b88a58;
        --candle-dark: #8a5a2d;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--page-bg);
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1280px, calc(100% - 32px));
        margin: 0 auto;
      }

      .site-header {
        background: var(--header-bg);
        border-bottom: 1px solid rgba(75, 45, 34, 0.18);
      }

      .nav-wrap {
        min-height: 88px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-transform: uppercase;
        color: var(--ink);
        letter-spacing: 0.08em;
        font-weight: 700;
      }

      .brand-name {
        font-size: clamp(1.2rem, 2vw, 2.05rem);
        line-height: 1;
        letter-spacing: 0.12em;
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 700;
        display: inline-block;
        transform: scaleY(0.92);
      }

      .brand-tag {
        margin-top: 4px;
        display: inline-flex;
        align-items: center;
        gap: 0;
        width: fit-content;
      }

      .brand-tag::before,
      .brand-tag::after {
        content: "";
        display: block;
        width: 18px;
        height: 4px;
        background: var(--gold-deep);
        margin: 0 4px;
        border-radius: 2px;
      }

      .brand-tag .boss {
        display: inline-block;
        margin: 0 2px;
        padding: 2px 8px 3px;
        background: var(--gold-deep);
        color: #f2efe8;
        font-size: 0.52rem;
        letter-spacing: 0.28em;
        font-weight: 700;
        line-height: 1.1;
      }

      .main-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        color: var(--nav);
        font-size: 0.95rem;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 500;
      }

      .main-nav a {
        color: var(--nav);
        transition: opacity 0.2s ease;
      }

      .main-nav a:hover {
        opacity: 0.75;
      }

      .nav-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 18px;
        background: #6d3b2d;
        border: 1px solid rgba(67, 42, 32, 0.8);
        color: #f8f3ee;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: none;
        font-weight: 700;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .hero {
        position: relative;
        min-height: 845px;
        background: linear-gradient(180deg, rgba(161, 146, 133, 0.82), rgba(161, 146, 133, 0.78)),
                    linear-gradient(90deg, rgba(16, 16, 16, 0.10), rgba(16, 16, 16, 0.12));
        overflow: hidden;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.02);
      }

      .hero-inner {
        position: relative;
        z-index: 1;
        min-height: 845px;
      }

      .scene {
        position: relative;
        width: 100%;
        height: 845px;
      }

      .hero-copy {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -40%);
        width: min(1200px, 75vw);
        text-align: center;
        color: rgba(255,255,255,0.92);
        font-family: 'Segoe Print', 'Bradley Hand', 'Lucida Handwriting', cursive;
        font-size: clamp(2.7rem, 5vw, 6rem);
        line-height: 1.16;
        letter-spacing: 0.01em;
        font-weight: 400;
        text-shadow: 0 0 1px rgba(255,255,255,0.25);
      }

      .hero-copy span {
        display: block;
      }

      .vase {
        position: absolute;
        right: 130px;
        bottom: 60px;
        width: 220px;
        height: 360px;
        background: linear-gradient(180deg, #faf8f7 0%, #e7e1dd 100%);
        border-radius: 28% 28% 26% 26% / 16% 16% 24% 24%;
        box-shadow: inset -25px 0 25px rgba(0,0,0,0.02), inset 18px 0 18px rgba(255,255,255,0.7);
      }

      .vase::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -30px;
        width: 180px;
        height: 80px;
        transform: translateX(-50%);
        border-radius: 50% 50% 44% 44%;
        background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(197,190,185,0.7));
      }

      .vase::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 20px;
        transform: translateX(-50%);
        width: 140px;
        height: 220px;
        border-radius: 40% 40% 18% 18%;
        background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(0,0,0,0.03));
      }

      .stem {
        position: absolute;
        right: 170px;
        top: 50px;
        width: 8px;
        height: 290px;
        background: linear-gradient(180deg, #8a806d, #d1be9a);
        border-radius: 15px;
        transform: rotate(18deg);
        opacity: 0.8;
      }

      .stem::before {
        content: "";
        position: absolute;
        left: -8px;
        top: -8px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(255,255,255,0.12));
      }

      .candle {
        position: absolute;
        right: 370px;
        bottom: 36px;
        width: 250px;
        height: 190px;
        border-radius: 38% 38% 46% 46% / 28% 28% 30% 30%;
        background: linear-gradient(180deg, #d5b385 0%, #a46b38 100%);
        box-shadow: 0 18px 26px rgba(93, 62, 35, 0.18), inset 0 0 0 2px rgba(103, 72, 40, 0.18);
      }

      .candle::before {
        content: "";
        position: absolute;
        inset: 4% 8% 8% 8%;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(0,0,0,0.06));
      }

      .candle::after {
        content: "";
        position: absolute;
        left: 50%;
        top: -26px;
        transform: translateX(-50%);
        width: 16px;
        height: 36px;
        border-radius: 4px 4px 8px 8px;
        background: linear-gradient(180deg, #f3e9d8, #d7bf92);
        box-shadow: 0 0 0 2px rgba(194,169,120,0.24);
      }

      @media (max-width: 900px) {
        .nav-wrap {
          flex-wrap: wrap;
          justify-content: center;
          padding: 18px 0;
        }

        .site-header {
          padding-bottom: 8px;
        }

        .main-nav {
          order: 3;
          width: 100%;
          flex-wrap: wrap;
          gap: 12px 20px;
        }

        .nav-cta {
          margin-left: auto;
        }

        .hero-copy {
          width: min(92vw, 900px);
          transform: translate(-50%, -30%);
        }

        .vase {
          right: 28px;
          width: 150px;
          height: 260px;
        }

        .candle {
          right: 180px;
          width: 180px;
          height: 150px;
        }
      }

      @media (max-width: 620px) {
        .brand-name {
          letter-spacing: 0.06em;
        }

        .main-nav {
          font-size: 0.84rem;
        }

        .hero {
          min-height: 640px;
        }

        .scene {
          height: 640px;
        }

        .hero-copy {
          transform: translate(-50%, -35%);
          font-size: clamp(2.3rem, 11vw, 4rem);
        }

        .vase {
          right: 12px;
          width: 120px;
          height: 200px;
        }

        .candle {
          right: 120px;
          width: 160px;
          height: 130px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand" aria-label="Independent Boss logo">
          <span class="brand-name">INDEPENDENT</span>
          <span class="brand-tag"><span class="boss">BOSS</span></span>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="#">Home</a>
          <a href="#">About Me</a>
          <a href="#">Work with me</a>
          <a href="#">Podcast</a>
          <a href="#">Contact</a>
        </nav>

        <a href="#" class="nav-cta">Book an Appointment</a>
      </div>
    </header>

    <main>
      <section class="hero" aria-label="Hero section">
        <div class="hero-inner container">
          <div class="scene">
            <div class="stem" aria-hidden="true"></div>
            <div class="vase" aria-hidden="true"></div>
            <div class="candle" aria-hidden="true"></div>

            <div class="hero-copy" aria-label="Hero headline">
              <span>Make your Business Fun and Easy</span>
              <span>with Systems and Funnels</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
